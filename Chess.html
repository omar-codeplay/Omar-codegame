<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="chess/Chess.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script defer src="chess/Chess.js"></script>
</head>

<body>
    <div class="container">
        <h1>Chess Game</h1>
        <p>Drag or click pieces to move. White at bottom.</p>

        <div class="game-info">
            <div id="turn" class="turn-display">White's Turn</div>
            <div id="game-status" class="status-display"></div>
        </div>

        <div id="board" class="board"></div>

        <div class="actions">
            <button id="reset-btn" class="btn">New Game</button>
            <button id="undo-btn" class="btn">Undo Move</button>
            <button id="load-fen-btn" class="btn">Load FEN</button>
            <button id="export-pgn-btn" class="btn">Export PGN</button>
            <button id="save-lib-btn" class="btn">Save Game</button>
            <button id="lib-btn" class="btn">Game Library</button>
        </div>

        <div class="theme-selector">
            <label for="board-theme">Theme:</label>
            <select id="board-theme" class="btn">
                <option value="classic">Classic Wood</option>
                <option value="green" selected>Chess.com Green</option>
                <option value="ocean">Ocean Blue</option>
            </select>
        </div>

        <div id="fen-modal" class="modal">
            <div class="modal-content"><span class="close">&times;</span>
                <h2>FEN</h2><textarea id="fen-input" rows="4"></textarea><button id="confirm-fen-btn"
                    class="btn">Load</button>
            </div>
        </div>
        <div id="library-modal" class="modal">
            <div class="modal-content"><span class="close">&times;</span>
                <h2>Library</h2>
                <div id="library-list"></div>
            </div>
        </div>
        <div id="save-modal" class="modal">
            <div class="modal-content"><span class="close">&times;</span>
                <h2>Save</h2><input type="text" id="game-name"><button id="confirm-save-btn" class="btn">Save</button>
            </div>
        </div>

        <div id="move-log" class="move-log">
            <h3>Move History</h3>
            <p id="pgn-notation" class="pgn-notation"></p>
            <div id="moves"></div>
        </div>
    </div>
</body>

</html>
