<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="chess/Chess.css">
    <link rel="icon" href="image/logo-nobg.png"/>
    <script async src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script defer src="chess/Chess.js"></script>
</head>
<body>
    <div class="container">
        <h1>Chess Game</h1>
        <p>Click a piece to select it. Highlighted squares show legal moves. Click to move.</p>
        
        <div class="game-info">
            <div id="turn" class="turn-display">White's Turn</div>
            <div id="game-status" class="status-display"></div>
        </div>

        <div id="board" class="board"></div>

        <div class="actions">
            <button id="reset-btn" class="btn">New Game</button>
            <button id="prev-move-btn" class="btn">← Prev Move</button>
            <button id="next-move-btn" class="btn">Next Move →</button>
            <button id="undo-btn" class="btn">Undo Move</button>
            <button id="load-fen-btn" class="btn">Load FEN</button>
            <button id="export-pgn-btn" class="btn">Export PGN</button>
            <button id="save-lib-btn" class="btn">Save Game</button>
            <button id="lib-btn" class="btn">Game Library</button>
        </div>

        <!-- FEN Modal -->
        <div id="fen-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Load FEN Position</h2>
                <p>Paste a valid FEN string to load a custom position:</p>
                <textarea id="fen-input" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" rows="4"></textarea>
                <button id="confirm-fen-btn" class="btn">Load Position</button>
            </div>
        </div>

        <!-- Game Library Modal -->
        <div id="library-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Game Library</h2>
                <div id="library-list" class="library-list"></div>
                <button id="clear-lib-btn" class="btn btn-danger">Clear All Games</button>
            </div>
        </div>

        <!-- Save Game Modal -->
        <div id="save-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Save Game</h2>
                <input type="text" id="game-name" placeholder="Enter game name (e.g., Game vs Friend)" maxlength="50">
                <button id="confirm-save-btn" class="btn">Save</button>
            </div>
        </div>

        <div id="move-log" class="move-log">
            <h3>Move History</h3>
            <p id="pgn-notation" class="pgn-notation"></p>
            <div id="moves"></div>
        </div>
    </div>
</body>
</html>
