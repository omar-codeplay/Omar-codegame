<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Board Editor · Chess Master</title>
  <link rel="icon" href="images/ChessLogo.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    :root {
      --bg: #161512;
      --panel: #1e1c19;
      --border: #3a3835;
      --green: #81b64c;
      --blue: #4f85c9;
      --text: #e8e4dc;
      --text-secondary: #8a8278;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      height: 60px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--green), var(--blue));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .logo-text span {
      color: var(--green);
    }

    .nav-links {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .nav-link {
      padding: 8px 16px;
      color: var(--text-secondary);
      text-decoration: none;
      border-radius: 6px;
      transition: 0.2s;
    }

    .nav-link.active {
      color: var(--green);
      background: rgba(129, 182, 76, 0.1);
    }

    .editor-container {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 40px;
      display: grid;
      grid-template-columns: minmax(500px, 1fr) 380px;
      gap: 50px;
      align-items: start;
    }

    .board-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #editorBoard {
      width: 100%;
      max-width: 750px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      aspect-ratio: 1/1;
    }

    .toolbar {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
    }

    .palette-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Turn Toggle UI */
    .turn-toggle {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .turn-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .turn-btn.active {
      background: var(--green);
      color: #111;
    }

    .piece-palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .palette-piece {
      aspect-ratio: 1;
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.1s;
    }

    .palette-piece.selected {
      border-color: var(--green);
      background: rgba(129, 182, 76, 0.15);
      box-shadow: 0 0 10px var(--green);
    }

    .palette-piece img {
      width: 80%;
      height: 80%;
      pointer-events: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-primary {
      background: var(--green);
      color: #111;
      border: none;
      margin-top: 10px;
      font-size: 16px;
    }

    .btn:hover {
      background: var(--border);
    }

    .fen-display {
      margin-top: 20px;
      padding: 15px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      word-break: break-all;
      color: var(--green);
      text-align: center;
      width: 100%;
      max-width: 750px;
    }

    .selected-info {
      margin: 12px 0;
      font-size: 14px;
      text-align: center;
      color: var(--text-secondary);
    }

    @media (max-width: 1100px) {
      .editor-container {
        grid-template-columns: 1fr;
        padding: 20px;
      }

      #editorBoard {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon">♞</div>
      <div class="logo-text">Chess<span>Master</span></div>
    </a>
    <div class="nav-links">
      <a href="puzzles.html" class="nav-link">Puzzles</a>
      <a href="practice.html" class="nav-link">Practice</a>
      <a href="editor.html" class="nav-link active">Editor</a>
    </div>
  </header>

  <div class="editor-container">
    <div class="board-area">
      <div id="editorBoard"></div>
      <div class="fen-display" id="fenDisplay"></div>
    </div>

    <div class="toolbar">
      <div class="palette-title">Side to move</div>
      <div class="turn-toggle">
        <button class="turn-btn active" id="turnW" onclick="setTurn('w')">White</button>
        <button class="turn-btn" id="turnB" onclick="setTurn('b')">Black</button>
      </div>

      <div class="palette-title">White Pieces</div>
      <div id="whitePalette" class="piece-palette"></div>

      <div class="palette-title">Black Pieces</div>
      <div id="blackPalette" class="piece-palette"></div>

      <div class="selected-info" id="selectedInfo">Select a piece to place</div>

      <button class="btn" id="flipBoardBtn">⇅ Flip Board</button>
      <button class="btn" id="startPosBtn">♜ Reset Position</button>
      <button class="btn" id="clearBoardBtn">🗑 Clear Board</button>
      <button class="btn btn-primary" id="playBtn">▶ Start Playing</button>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script>
    const PIECE_PATH = 'images/';
    const pieceNames = { k: 'King', q: 'Queen', r: 'Rook', b: 'Bishop', n: 'Knight', p: 'Pawn' };

    const moveSnd = new Audio('sounds/move.mp3');
    const captureSnd = new Audio('sounds/capture.mp3');

    let board, chess = new Chess();
    let selectedPiece = null;
    let currentTurn = 'w';

    function playSound(isCap = false) {
      const s = isCap ? captureSnd : moveSnd;
      s.currentTime = 0; s.play().catch(() => { });
    }

    function setTurn(side) {
      currentTurn = side;
      document.getElementById('turnW').classList.toggle('active', side === 'w');
      document.getElementById('turnB').classList.toggle('active', side === 'b');

      let fenParts = chess.fen().split(' ');
      fenParts[1] = side;
      chess.load(fenParts.join(' '));
      updateFen();
    }

    function buildPalette() {
      const pieces = ['k', 'q', 'r', 'b', 'n', 'p'];
      ['w', 'b'].forEach(color => {
        const container = document.getElementById(color === 'w' ? 'whitePalette' : 'blackPalette');
        pieces.forEach(type => {
          const div = document.createElement('div');
          div.className = 'palette-piece';
          const img = document.createElement('img');
          img.src = `${PIECE_PATH}${color === 'w' ? 'white' : 'black'}-${pieceNames[type]}.png`;
          div.appendChild(img);
          div.onclick = () => {
            $('.palette-piece').removeClass('selected');
            div.classList.add('selected');
            selectedPiece = { color, type };
            document.getElementById('selectedInfo').innerHTML = `Selected: <b>${color === 'w' ? 'White' : 'Black'} ${pieceNames[type]}</b>`;
          };
          container.appendChild(div);
        });
      });
    }

    function updateFen() {
      // Force turn stability in chess.js
      let fen = chess.fen();
      let parts = fen.split(' ');
      if (parts[1] !== currentTurn) {
        parts[1] = currentTurn;
        fen = parts.join(' ');
        chess.load(fen);
      }
      document.getElementById('fenDisplay').textContent = 'FEN: ' + fen;
    }

    board = ChessBoard('editorBoard', {
      position: 'start',
      draggable: true,
      dropOffBoard: 'trash',
      pieceTheme: (p) => `${PIECE_PATH}${p[0] === 'w' ? 'white' : 'black'}-${pieceNames[p[1].toLowerCase()]}.png`,
      onDrop: (src, tgt) => {
        if (tgt === 'offboard') {
          chess.remove(src);
          playSound();
        } else {
          const p = chess.get(src);
          const cap = chess.get(tgt);
          if (p) {
            chess.remove(src);
            chess.put({ type: p.type, color: p.color }, tgt);
            playSound(cap);
          }
        }
        updateFen();
        setTimeout(() => board.position(chess.fen()), 50);
      }
    });

    $('#editorBoard').on('click', '.square-55d63', function () {
      if (!selectedPiece) return;
      const sq = $(this).attr('data-square');
      const cap = chess.get(sq);
      chess.put({ type: selectedPiece.type, color: selectedPiece.color }, sq);

      // Maintain Turn
      let parts = chess.fen().split(' ');
      parts[1] = currentTurn;
      chess.load(parts.join(' '));

      board.position(chess.fen());
      playSound(cap);
      updateFen();
    });

    document.getElementById('clearBoardBtn').onclick = () => { chess.clear(); board.clear(); setTurn('w'); updateFen(); };
    document.getElementById('startPosBtn').onclick = () => { chess.reset(); board.position('start'); setTurn('w'); updateFen(); };
    document.getElementById('flipBoardBtn').onclick = () => board.flip();

    document.getElementById('playBtn').onclick = () => {
      let fen = chess.fen();
      let parts = fen.split(' ');

      // If the pieces are in start positions, ensure castling rights (KQkq) are added
      // This is a simple fix to make sure castling works when you export
      if (parts[2] === '-') {
        // You could add logic here to detect if kings/rooks are on home squares
        // For now, we force them if it's a standard-ish setup
        parts[2] = 'KQkq';
      }

      const finalFen = parts.join(' ');
      localStorage.setItem('chess_custom_fen', finalFen);
      window.location.href = 'practice.html';
    };

    window.onresize = board.resize;
    buildPalette();
    updateFen();
  </script>
</body>

</html>
