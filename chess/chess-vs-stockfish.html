<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Chess vs Stockfish 18</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #161512;
      --surface:  #1e1c19;
      --surface2: #272420;
      --border:   #3a3835;
      --green:    #81b64c;
      --blue:     #4f85c9;
      --yellow:   #f4c143;
      --red:      #c0392b;
      --text:     #e8e4dc;
      --text2:    #8a8278;
      --radius:   8px;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .site-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .site-header .logo {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }
    .site-header .logo span { color: var(--green); }
    .header-badge {
      background: rgba(79,133,201,0.15);
      border: 1px solid rgba(79,133,201,0.3);
      color: var(--blue);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Courier Prime', monospace;
    }
    .header-sub {
      margin-left: auto;
      font-size: 12px;
      color: var(--text2);
      font-family: 'Courier Prime', monospace;
    }

    /* ── LAYOUT ──────────────────────────────────────────────── */
    .game-container {
      display: flex;
      gap: 20px;
      padding: 20px 24px;
      max-width: 1080px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .board-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex-shrink: 0;
    }

    #gameBoard {
      width: 480px;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-width: 240px;
      max-width: 300px;
    }

    /* ── CARDS ───────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .card-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text2);
      margin-bottom: 12px;
    }

    /* ── STATUS BAR ──────────────────────────────────────────── */
    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--text2);
    }
    .status-dot.info    { background: var(--blue); }
    .status-dot.success { background: var(--green); }
    .status-dot.error   { background: var(--red); }
    .status-dot.loading {
      background: var(--yellow);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .status-dot.thinking {
      background: var(--blue);
      animation: pulse 0.6s infinite;
    }

    #statusText {
      font-size: 13px;
      color: var(--text2);
      font-family: 'Courier Prime', monospace;
      flex: 1;
    }

    /* ── COLOR SELECTOR ─────────────────────────────────────── */
    .color-btns {
      display: flex;
      gap: 8px;
    }
    .color-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .color-btn:hover { border-color: var(--text2); color: var(--text); }
    .color-btn.active {
      border-color: var(--green);
      color: var(--green);
      background: rgba(129,182,76,0.08);
    }
    .color-btn .piece-icon { font-size: 18px; display: block; margin-bottom: 3px; }

    /* ── LEVEL SELECTOR ─────────────────────────────────────── */
    .level-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .level-btn {
      padding: 8px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text2);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      line-height: 1.3;
    }
    .level-btn:hover { border-color: var(--text2); color: var(--text); }
    .level-btn.active {
      border-color: var(--yellow);
      color: var(--yellow);
      background: rgba(244,193,67,0.08);
    }
    .level-btn .elo-label {
      display: block;
      font-size: 10px;
      font-family: 'Courier Prime', monospace;
      font-weight: 400;
      color: var(--text2);
      margin-top: 2px;
    }
    .level-btn.active .elo-label { color: rgba(244,193,67,0.7); }

    /* ── GAME INFO ───────────────────────────────────────────── */
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text2);
      font-family: 'Courier Prime', monospace;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-row .val { color: var(--text); font-weight: 600; }
    .info-row .val.green  { color: var(--green); }
    .info-row .val.yellow { color: var(--yellow); }
    .info-row .val.red    { color: var(--red); }
    .info-row .val.blue   { color: var(--blue); }

    /* ── MOVE LIST ───────────────────────────────────────────── */
    .move-list-wrap {
      max-height: 180px;
      overflow-y: auto;
    }
    .move-row {
      display: grid;
      grid-template-columns: 28px 1fr 1fr;
      gap: 4px;
      padding: 3px 0;
      border-bottom: 1px solid rgba(58,56,53,0.5);
      font-family: 'Courier Prime', monospace;
      font-size: 13px;
    }
    .move-row:last-child { border-bottom: none; }
    .move-num { color: var(--text2); font-size: 11px; padding-top: 1px; }
    .move-san { color: var(--text); cursor: default; padding: 0 4px; border-radius: 3px; }
    .move-san:hover { background: var(--surface2); }
    .move-san.current { background: rgba(129,182,76,0.15); color: var(--green); }
    .no-moves { color: var(--text2); font-size: 12px; font-family: 'Courier Prime', monospace; text-align: center; padding: 8px 0; }

    /* ── BUTTONS ─────────────────────────────────────────────── */
    .btn {
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { border-color: var(--text2); background: var(--border); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: rgba(129,182,76,0.15);
      border-color: rgba(129,182,76,0.4);
      color: var(--green);
    }
    .btn-primary:hover:not(:disabled) {
      background: rgba(129,182,76,0.25);
      border-color: var(--green);
    }
    .btn-danger {
      background: rgba(192,57,43,0.1);
      border-color: rgba(192,57,43,0.3);
      color: var(--red);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(192,57,43,0.2);
      border-color: var(--red);
    }

    .action-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .action-row .btn { flex: 1; min-width: 0; font-size: 12px; padding: 9px 8px; }

    /* ── BOARD HIGHLIGHTS ────────────────────────────────────── */
    .highlight-from  { box-shadow: inset 0 0 0 3px rgba(129,182,76,0.85)  !important; }
    .highlight-to    { box-shadow: inset 0 0 0 3px rgba(79,133,201,0.65)  !important; }
    .last-move-light { background: rgba(244,193,67,0.30) !important; }
    .last-move-dark  { background: rgba(244,193,67,0.20) !important; }

    /* ── CAPTURE STRIP ───────────────────────────────────────── */
    .capture-strip {
      display: flex;
      align-items: center;
      gap: 2px;
      min-height: 22px;
      flex-wrap: wrap;
    }
    .capture-strip img { width: 20px; height: 20px; }
    .material-score {
      margin-left: auto;
      font-size: 12px;
      font-family: 'Courier Prime', monospace;
      color: var(--green);
      font-weight: 700;
    }

    /* ── SCROLLBAR ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* ── RESPONSIVE ──────────────────────────────────────────── */
    @media (max-width: 820px) {
      .game-container { flex-direction: column; padding: 12px; }
      #gameBoard { width: 100%; }
      .sidebar { max-width: 100%; }
      .level-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 480px) {
      #gameBoard { width: calc(100vw - 24px); }
      .level-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="logo">Chess<span>Lab</span></div>
    <span class="header-badge">VS STOCKFISH 18</span>
    <span class="header-sub" id="engineStatus">Loading engine…</span>
  </header>

  <div class="game-container">

    <!-- ── BOARD COLUMN ───────────────────────── -->
    <div class="board-column">

      <!-- Opponent capture strip -->
      <div class="card" style="padding:8px 14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;color:var(--text2);font-family:'Courier Prime',monospace;" id="opponentLabel">Stockfish</span>
          <div class="capture-strip" id="opponentCaptures"></div>
        </div>
      </div>

      <div id="gameBoard"></div>

      <!-- Player capture strip -->
      <div class="card" style="padding:8px 14px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:11px;color:var(--text2);font-family:'Courier Prime',monospace;" id="playerLabel">You</span>
          <div class="capture-strip" id="playerCaptures"></div>
        </div>
      </div>

      <!-- Status bar -->
      <div class="status-bar">
        <div class="status-dot loading" id="statusDot"></div>
        <span id="statusText">Loading Stockfish 18…</span>
      </div>

    </div>

    <!-- ── SIDEBAR ─────────────────────────────── -->
    <div class="sidebar">

      <!-- Game Info -->
      <div class="card">
        <div class="card-title">Game Info</div>
        <div class="info-row">
          <span>You play</span>
          <span class="val" id="infoColor">—</span>
        </div>
        <div class="info-row">
          <span>Level</span>
          <span class="val yellow" id="infoLevel">—</span>
        </div>
        <div class="info-row">
          <span>ELO</span>
          <span class="val blue" id="infoElo">—</span>
        </div>
        <div class="info-row">
          <span>Move</span>
          <span class="val" id="infoMove">—</span>
        </div>
        <div class="info-row">
          <span>Turn</span>
          <span class="val green" id="infoTurn">—</span>
        </div>
      </div>

      <!-- Play as -->
      <div class="card">
        <div class="card-title">Play As</div>
        <div class="color-btns">
          <button class="color-btn active" data-color="white">
            <span class="piece-icon">♔</span>White
          </button>
          <button class="color-btn" data-color="random">
            <span class="piece-icon">🎲</span>Random
          </button>
          <button class="color-btn" data-color="black">
            <span class="piece-icon">♚</span>Black
          </button>
        </div>
      </div>

      <!-- Difficulty -->
      <div class="card">
        <div class="card-title">Difficulty</div>
        <div class="level-grid" id="levelGrid"></div>
      </div>

      <!-- Move History -->
      <div class="card">
        <div class="card-title">Move History</div>
        <div class="move-list-wrap">
          <div id="moveList"><div class="no-moves">No moves yet</div></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="card">
        <div class="card-title">Controls</div>
        <div class="action-row">
          <button class="btn btn-primary" id="newGameBtn">⚑ New Game</button>
          <button class="btn" id="flipBtn">⇅ Flip</button>
          <button class="btn btn-danger" id="resignBtn" disabled>⚐ Resign</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

  <script>
    // ============================================================
    // SOUNDS
    // ============================================================
    const sounds = {
      move:    new Audio('audio/move.mp3'),
      capture: new Audio('audio/capture.mp3'),
      castle:  new Audio('audio/castle.mp3'),
      check:   new Audio('audio/check.mp3'),
      gameEnd: new Audio('audio/game-end.mp3'),
    };
    Object.values(sounds).forEach(s => { s.load(); s.volume = 0.5; });

    let audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      Object.values(sounds).forEach(s => { s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {}); });
      audioUnlocked = true;
    }
    function playSnd(name) {
      if (!audioUnlocked) unlockAudio();
      const s = sounds[name];
      if (s) { s.currentTime = 0; s.play().catch(() => {}); }
    }
    document.body.addEventListener('mousedown', unlockAudio);
    document.body.addEventListener('touchstart', unlockAudio);

    // ============================================================
    // LEVELS
    // ============================================================
    const LEVELS = [
      { name: 'Beginner',     elo: 800,  skill: 0,  movetime: 150  },
      { name: 'Novice',       elo: 1000, skill: 3,  movetime: 300  },
      { name: 'Easy',         elo: 1200, skill: 5,  movetime: 500  },
      { name: 'Casual',       elo: 1400, skill: 8,  movetime: 700  },
      { name: 'Club',         elo: 1600, skill: 11, movetime: 900  },
      { name: 'Intermediate', elo: 1800, skill: 13, movetime: 1200 },
      { name: 'Advanced',     elo: 2100, skill: 15, movetime: 1500 },
      { name: 'Expert',       elo: 2500, skill: 17, movetime: 2000 },
      { name: 'Master',       elo: 2800, skill: 19, movetime: 3000 },
      { name: 'Maximum',      elo: 3400, skill: 20, movetime: 5000 },
    ];

    // Build level buttons
    const levelGrid = document.getElementById('levelGrid');
    LEVELS.forEach((lvl, i) => {
      const btn = document.createElement('button');
      btn.className = 'level-btn' + (i === 2 ? ' active' : '');
      btn.dataset.index = i;
      btn.innerHTML = `${lvl.name}<span class="elo-label">${lvl.elo} ELO</span>`;
      btn.onclick = () => selectLevel(i);
      levelGrid.appendChild(btn);
    });

    let selectedLevelIndex = 2;

    function selectLevel(i) {
      selectedLevelIndex = i;
      document.querySelectorAll('.level-btn').forEach((b, idx) =>
        b.classList.toggle('active', idx === i));
      updateInfoPanel();
      // Re-apply options if engine is ready
      if (sfReady) applyLevelToEngine();
    }

    // ============================================================
    // STOCKFISH WORKER
    // ============================================================
    let stockfish   = null;
    let sfReady     = false;
    let engineBusy  = false;

    function initEngine() {
      try {
        stockfish = new Worker('stockfish-18-lite-single.js');
        stockfish.onmessage  = handleEngineMessage;
        stockfish.onerror    = () => {
          updateStatus('Engine file not found. Make sure stockfish-18-lite-single.js is in the same folder.', 'error');
          document.getElementById('engineStatus').textContent = '⚠ Engine missing';
        };
        stockfish.postMessage('uci');
      } catch (e) {
        updateStatus('Could not start engine: ' + e.message, 'error');
      }
    }

    function handleEngineMessage(e) {
      const msg = e.data;
      if (msg === 'uciok') {
        stockfish.postMessage('isready');
      } else if (msg === 'readyok') {
        sfReady = true;
        document.getElementById('engineStatus').textContent = '✓ Stockfish 18 ready';
        updateStatus('Stockfish 18 ready — choose a level and start a game.', 'success');
      } else if (msg.startsWith('bestmove')) {
        engineBusy = false;
        const parts    = msg.split(' ');
        const uciMove  = parts[1];
        if (uciMove && uciMove !== '(none)') {
          applyEngineMove(uciMove);
        }
      }
    }

    function applyLevelToEngine() {
      const lvl = LEVELS[selectedLevelIndex];
      if (lvl.elo >= 1320) {
        stockfish.postMessage('setoption name UCI_LimitStrength value true');
        stockfish.postMessage(`setoption name UCI_Elo value ${Math.min(lvl.elo, 3190)}`);
      } else {
        stockfish.postMessage('setoption name UCI_LimitStrength value false');
      }
      stockfish.postMessage(`setoption name Skill Level value ${lvl.skill}`);
    }

    function requestEngineMove() {
      if (!sfReady || !gameActive || game.game_over() || engineBusy) return;
      engineBusy = true;
      const lvl = LEVELS[selectedLevelIndex];
      updateStatus('Stockfish is thinking…', 'thinking');
      stockfish.postMessage(`position fen ${game.fen()}`);
      stockfish.postMessage(`go movetime ${lvl.movetime}`);
    }

    function applyEngineMove(uci) {
      const from  = uci.slice(0, 2);
      const to    = uci.slice(2, 4);
      const promo = uci[4] || 'q';

      const move = game.move({ from, to, promotion: promo });
      if (!move) return;

      board.position(game.fen());
      setLastMoveHighlight(from, to);
      addMoveToHistory(move);
      renderMoveList();
      updateCaptureStrips();
      updateInfoPanel();

      playSnd(getSoundForMove(move));
      if (game.in_check()) { playSnd('check'); }

      if (game.game_over()) { handleGameOver(); return; }
      updateStatus(`Your turn (${playerColor === 'white' ? 'White' : 'Black'})`, 'info');
    }

    // ============================================================
    // GAME STATE
    // ============================================================
    let game        = new Chess();
    let board       = null;
    let playerColor = 'white';
    let gameActive  = false;
    let moveHistory = []; // array of { num, white, black }
    let lastFrom    = null;
    let lastTo      = null;

    function newGame() {
      if (!sfReady) {
        updateStatus('Engine not ready yet. Please wait…', 'error');
        return;
      }

      // Resolve color
      let chosenColor = document.querySelector('.color-btn.active')?.dataset.color || 'white';
      if (chosenColor === 'random') chosenColor = Math.random() < 0.5 ? 'white' : 'black';
      playerColor = chosenColor;

      game        = new Chess();
      moveHistory = [];
      lastFrom    = null;
      lastTo      = null;
      gameActive  = true;
      engineBusy  = false;

      stockfish.postMessage('ucinewgame');
      applyLevelToEngine();

      if (!board) {
        board = Chessboard('gameBoard', {
          draggable:           true,
          position:            'start',
          pieceTheme:          'https://lichess1.org/assets/piece/cburnett/{piece}.svg',
          onDragStart:         onDragStart,
          onDrop:              onDrop,
          onSnapEnd:           onSnapEnd,
          onMouseoverSquare:   onMouseoverSquare,
          onMouseoutSquare:    onMouseoutSquare,
          orientation:         playerColor,
        });
      } else {
        board.orientation(playerColor);
        board.start(false);
      }

      clearAllHighlights();
      renderMoveList();
      updateCaptureStrips();
      updateInfoPanel();
      updateStatus(`Game started! You play as ${playerColor === 'white' ? 'White ♔' : 'Black ♚'}`, 'success');

      document.getElementById('resignBtn').disabled = false;

      // If player chose Black, engine plays first
      if (playerColor === 'black') {
        setTimeout(requestEngineMove, 600);
      }
    }

    // ============================================================
    // BOARD CALLBACKS
    // ============================================================
    function onDragStart(source, piece) {
      if (!gameActive || game.game_over())  return false;
      if (engineBusy)                        return false;
      if (game.turn() === 'w' && playerColor === 'black') return false;
      if (game.turn() === 'b' && playerColor === 'white') return false;
      if ((game.turn() === 'w') !== (piece[0] === 'w'))  return false;
      return true;
    }

    function onDrop(source, target) {
      clearMoveHighlights();

      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (!move) return 'snapback';

      setLastMoveHighlight(source, target);
      addMoveToHistory(move);
      renderMoveList();
      updateCaptureStrips();
      updateInfoPanel();

      playSnd(getSoundForMove(move));
      if (game.in_check()) playSnd('check');

      if (game.game_over()) { handleGameOver(); return; }

      setTimeout(requestEngineMove, 250);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function onMouseoverSquare(square, piece) {
      if (!gameActive || game.game_over() || engineBusy) return;
      if (!piece) return;
      if (game.turn() === 'w' && (playerColor === 'black' || piece[0] !== 'w')) return;
      if (game.turn() === 'b' && (playerColor === 'white' || piece[0] !== 'b')) return;

      const moves = game.moves({ square, verbose: true });
      if (!moves.length) return;

      $(`[data-square="${square}"]`).addClass('highlight-from');
      moves.forEach(m => $(`[data-square="${m.to}"]`).addClass('highlight-to'));
    }

    function onMouseoutSquare() {
      clearMoveHighlights();
    }

    // ============================================================
    // GAME OVER
    // ============================================================
    function handleGameOver() {
      gameActive = false;
      document.getElementById('resignBtn').disabled = true;
      playSnd('gameEnd');

      if (game.in_checkmate()) {
        const winner = game.turn() === 'w' ? 'black' : 'white';
        if (winner === playerColor) {
          updateStatus('✓ You win by checkmate! Well played!', 'success');
        } else {
          updateStatus('✘ Stockfish wins by checkmate. Better luck next time!', 'error');
        }
      } else if (game.in_stalemate()) {
        updateStatus('Draw — stalemate.', 'info');
      } else if (game.in_threefold_repetition()) {
        updateStatus('Draw — threefold repetition.', 'info');
      } else if (game.insufficient_material()) {
        updateStatus('Draw — insufficient material.', 'info');
      } else if (game.in_draw()) {
        updateStatus('Draw.', 'info');
      }
    }

    // ============================================================
    // MOVE HISTORY
    // ============================================================
    function addMoveToHistory(move) {
      if (game.turn() === 'b') {
        // White just moved
        const num = Math.ceil(game.history().length / 2);
        moveHistory.push({ num, white: move.san, black: '' });
      } else {
        // Black just moved
        if (moveHistory.length > 0) {
          moveHistory[moveHistory.length - 1].black = move.san;
        }
      }
    }

    function renderMoveList() {
      const el = document.getElementById('moveList');
      if (!moveHistory.length) {
        el.innerHTML = '<div class="no-moves">No moves yet</div>';
        return;
      }
      el.innerHTML = moveHistory.map(m =>
        `<div class="move-row">
          <span class="move-num">${m.num}.</span>
          <span class="move-san">${m.white}</span>
          <span class="move-san">${m.black}</span>
        </div>`
      ).join('');
      el.parentElement.scrollTop = el.parentElement.scrollHeight;
    }

    // ============================================================
    // CAPTURE STRIPS + MATERIAL
    // ============================================================
    const PIECE_VALUES = { p:1, n:3, b:3, r:5, q:9 };
    const PIECE_UNICODE = {
      wp:'♙', wn:'♘', wb:'♗', wr:'♖', wq:'♕',
      bp:'♟', bn:'♞', bb:'♝', br:'♜', bq:'♛'
    };

    function updateCaptureStrips() {
      const history   = game.history({ verbose: true });
      const captured  = { w: [], b: [] }; // captured[color of capturer]
      history.forEach(m => {
        if (m.captured) captured[m.color].push(m.captured);
      });

      const matW = captured['w'].reduce((s,p) => s + (PIECE_VALUES[p]||0), 0);
      const matB = captured['b'].reduce((s,p) => s + (PIECE_VALUES[p]||0), 0);
      const diff = matW - matB;

      const pStrip = document.getElementById('playerCaptures');
      const oStrip = document.getElementById('opponentCaptures');

      const playerCapColor = playerColor === 'white' ? 'w' : 'b';
      const oppoCapColor   = playerColor === 'white' ? 'b' : 'w';

      pStrip.innerHTML = captured[playerCapColor]
        .sort((a,b) => (PIECE_VALUES[b]||0) - (PIECE_VALUES[a]||0))
        .map(p => `<span style="font-size:18px;line-height:1;">${PIECE_UNICODE[oppoCapColor + p] || ''}</span>`)
        .join('');

      oStrip.innerHTML = captured[oppoCapColor]
        .sort((a,b) => (PIECE_VALUES[b]||0) - (PIECE_VALUES[a]||0))
        .map(p => `<span style="font-size:18px;line-height:1;">${PIECE_UNICODE[playerCapColor + p] || ''}</span>`)
        .join('');

      // Append material advantage
      const advantage = playerColor === 'white' ? diff : -diff;
      if (advantage > 0)
        pStrip.innerHTML += `<span class="material-score">+${advantage}</span>`;
      else if (advantage < 0)
        oStrip.innerHTML += `<span class="material-score">+${Math.abs(advantage)}</span>`;
    }

    // ============================================================
    // HIGHLIGHTS
    // ============================================================
    function setLastMoveHighlight(from, to) {
      $('.last-move-light, .last-move-dark').removeClass('last-move-light last-move-dark');

      // Determine if a square is on a light or dark square
      const files = 'abcdefgh';
      const isLight = (sq) => {
        const f = files.indexOf(sq[0]);
        const r = parseInt(sq[1]) - 1;
        return (f + r) % 2 !== 0;
      };

      $(`[data-square="${from}"]`).addClass(isLight(from) ? 'last-move-light' : 'last-move-dark');
      $(`[data-square="${to}"]`).addClass(isLight(to) ? 'last-move-light' : 'last-move-dark');

      lastFrom = from;
      lastTo   = to;
    }

    function clearMoveHighlights() {
      $('.highlight-from, .highlight-to').removeClass('highlight-from highlight-to');
    }

    function clearAllHighlights() {
      $('.highlight-from, .highlight-to, .last-move-light, .last-move-dark')
        .removeClass('highlight-from highlight-to last-move-light last-move-dark');
    }

    // ============================================================
    // INFO PANEL
    // ============================================================
    function updateInfoPanel() {
      const lvl = LEVELS[selectedLevelIndex];
      document.getElementById('infoLevel').textContent = lvl.name;
      document.getElementById('infoElo').textContent   = lvl.elo;

      if (gameActive || game.history().length > 0) {
        const colorLabel = playerColor === 'white' ? '⬜ White' : '⬛ Black';
        document.getElementById('infoColor').textContent = colorLabel;

        const moveNum = Math.ceil(game.history().length / 2) || 1;
        document.getElementById('infoMove').textContent  = moveNum;

        const turnColor = game.turn() === 'w' ? 'White' : 'Black';
        const isYours   = (game.turn() === playerColor[0]);
        const turnEl    = document.getElementById('infoTurn');
        turnEl.textContent = turnColor;
        turnEl.className   = 'val ' + (isYours ? 'green' : 'blue');
      } else {
        document.getElementById('infoColor').textContent = '—';
        document.getElementById('infoMove').textContent  = '—';
        document.getElementById('infoTurn').textContent  = '—';
      }
    }

    // ============================================================
    // STATUS
    // ============================================================
    function updateStatus(msg, type) {
      document.getElementById('statusText').textContent    = msg;
      document.getElementById('statusDot').className       = `status-dot ${type}`;
    }

    function getSoundForMove(move) {
      if (move.flags.includes('k') || move.flags.includes('q')) return 'castle';
      if (move.captured) return 'capture';
      return 'move';
    }

    // ============================================================
    // CONTROLS
    // ============================================================
    document.getElementById('newGameBtn').onclick = newGame;

    document.getElementById('flipBtn').onclick = () => {
      if (board) board.flip();
    };

    document.getElementById('resignBtn').onclick = () => {
      if (!gameActive) return;
      gameActive = false;
      document.getElementById('resignBtn').disabled = true;
      const winner = playerColor === 'white' ? 'Black' : 'White';
      updateStatus(`You resigned. Stockfish (${winner}) wins.`, 'error');
    };

    // Color selector
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });

    // ============================================================
    // INIT
    // ============================================================
    updateInfoPanel();
    initEngine();
  </script>
</body>
</html>
