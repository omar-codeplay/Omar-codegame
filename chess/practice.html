<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice · Chess Master</title>
  <link rel="icon" href="images/ChessLogo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    :root {
      --bg: #161512;
      --panel: #1e1c19;
      --border: #3a3835;
      --green: #81b64c;
      --text: #e8e4dc;
      --text-sec: #8a8278;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
    .header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; height: 60px; }
    .logo { text-decoration: none; color: var(--text); font-family: 'Space Grotesk'; font-size: 20px; font-weight: 700; }
    .logo span { color: var(--green); }
    .game-container { display: flex; justify-content: center; align-items: flex-start; gap: 40px; max-width: 1600px; margin: 20px auto; padding: 0 40px; }
    .board-wrapper { flex: 1; max-width: min(80vh, 800px); min-width: 400px; }
    #practiceBoard { width: 100%; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8); border: 2px solid var(--border); }
    .sidebar { width: 360px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    .status-area { font-size: 22px; font-weight: 700; color: var(--green); text-align: center; margin-bottom: 15px; }
    .move-history { height: 350px; overflow-y: auto; background: #111; border-radius: 8px; padding: 15px; font-family: 'Courier New', monospace; font-size: 15px; border: 1px solid var(--border); }
    .move-line { display: flex; padding: 6px 0; border-bottom: 1px solid #222; }
    .m-num { width: 45px; color: var(--text-sec); }
    .m-move { flex: 1; }
    .btn { width: 100%; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); transition: 0.2s; margin-top: 10px; font-size: 14px; }
    .btn-main { background: var(--green); color: #111; border: none; margin-top: 20px; font-size: 16px; }
    .btn:hover { background: var(--border); }
    @media (max-width: 1000px) { .game-container { flex-direction: column; align-items: center; padding: 10px; } .board-wrapper { max-width: 100%; min-width: 100%; } .sidebar { width: 100%; } }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">♞ Chess<span>Master</span></a>
  </header>

  <div class="game-container">
    <div class="board-wrapper">
      <div id="practiceBoard"></div>
    </div>
    <div class="sidebar">
      <div class="card">
        <div class="status-area" id="status">White to move</div>
        <div class="move-history" id="moveHistory"></div>
        <button class="btn btn-main" id="resetBtn">New Practice Game</button>
        <button class="btn" id="undoBtn">Undo Move</button>
        <button class="btn" id="flipBtn">Flip View</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script>
    // AUDIO CONFIG
    const sounds = {
      move: new Audio('audio/move.mp3'),
      capture: new Audio('audio/capture.mp3'),
      castle: new Audio('audio/castle.mp3'),
      promote: new Audio('audio/promote.mp3'),
      check: new Audio('audio/check.mp3'),
      gameEnd: new Audio('audio/game-end.mp3')
    };

    let audioUnlocked = false;
    function unlockAudio() {
      if (audioUnlocked) return;
      Object.values(sounds).forEach(s => {
        s.play().then(() => { s.pause(); s.currentTime = 0; }).catch(() => {});
      });
      audioUnlocked = true;
    }

    function playSnd(name) {
      if (sounds[name]) {
        sounds[name].currentTime = 0;
        sounds[name].play().catch(e => console.log("Audio block:", e));
      }
    }

    document.body.addEventListener('mousedown', unlockAudio);
    document.body.addEventListener('touchstart', unlockAudio);

    let board, game = new Chess();

    const editorFen = localStorage.getItem('chess_custom_fen');
    if (editorFen) game.load(editorFen);

    function onDrop(source, target) {
      unlockAudio();
      
      let promotionPiece = 'q';
      const sourcePiece = game.get(source);
      const isPromotion = sourcePiece && sourcePiece.type === 'p' && 
                          ((sourcePiece.color === 'w' && target[1] === '8') || 
                           (sourcePiece.color === 'b' && target[1] === '1'));

      if (isPromotion) {
        const choice = confirm("Promote to Queen? (Cancel for Knight)");
        promotionPiece = choice ? 'q' : 'n';
      }

      let move = game.move({ from: source, to: target, promotion: promotionPiece });
      if (move === null) return 'snapback';

      // SOUND LOGIC
      if (game.in_checkmate() || game.in_draw()) {
        playSnd('gameEnd');
      } else if (game.in_check()) {
        playSnd('check');
      } else if (isPromotion) {
        playSnd('promote');
      } else if (move.flags.includes('k') || move.flags.includes('q')) {
        playSnd('castle');
      } else if (move.captured) {
        playSnd('capture');
      } else {
        playSnd('move');
      }

      updateUI();
    }

    function updateUI() {
      let status = '';
      let moveColor = game.turn() === 'w' ? 'White' : 'Black';
      const statusEl = document.getElementById('status');

      if (game.in_checkmate()) {
        status = `GAME OVER - ${moveColor} is Checkmated!`;
        statusEl.style.color = "#ff4444";
      } else if (game.in_draw()) {
        status = "GAME OVER - Draw";
        statusEl.style.color = "#8a8278";
      } else {
        status = `${moveColor} to move`;
        statusEl.style.color = game.in_check() ? "#ffbb00" : "var(--green)";
        if (game.in_check()) status += " - CHECK!";
      }

      statusEl.innerText = status;

      const history = game.history();
      let html = '';
      for (let i = 0; i < history.length; i += 2) {
        html += `<div class="move-line">
                <span class="m-num">${Math.floor(i / 2) + 1}.</span>
                <span class="m-move">${history[i]}</span>
                <span class="m-move">${history[i + 1] || ''}</span>
               </div>`;
      }
      const histDiv = document.getElementById('moveHistory');
      histDiv.innerHTML = html;
      histDiv.scrollTop = histDiv.scrollHeight;
    }

    board = ChessBoard('practiceBoard', {
      draggable: true,
      position: game.fen(),
      pieceTheme: (p) => {
        const color = p[0] === 'w' ? 'white' : 'black';
        const type = { p: 'Pawn', n: 'Knight', b: 'Bishop', r: 'Rook', q: 'Queen', k: 'King' }[p[1].toLowerCase()];
        return `images/${color}-${type}.png`;
      },
      onDrop: onDrop,
      onSnapEnd: () => board.position(game.fen())
    });

    document.getElementById('undoBtn').onclick = () => { game.undo(); board.position(game.fen()); updateUI(); };
    document.getElementById('flipBtn').onclick = () => board.flip();
    document.getElementById('resetBtn').onclick = () => {
      game.reset();
      board.position('start');
      localStorage.removeItem('chess_custom_fen');
      updateUI();
    };

    window.onresize = () => board.resize();
    updateUI();
  </script>
</body>
</html>
