<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قمة القلعة - Fortress Duel</title>
    <link rel="stylesheet" href="fortress/fortress.css">
</head>
<body>
    <div class="container">
        <h1>🏰 قمة القلعة</h1>
        <p>Fortress Duel - لعبة إستراتيجية جديدة</p>

        <div class="game-info">
            <span class="turn-indicator" id="turn-indicator">🔴 دور الأحمر</span>
        </div>

        <div class="board" id="board"></div>

        <div class="winner-banner" id="winnerBanner" style="display:none">
          <div class="winner-text" id="winnerText">🏆 الفائز هو الأحمر!</div>
          <button class="btn-small" onclick="window.game.resetGame()">⟳ لعب مرة أخرى</button>
        </div>

        <button id="reset-btn" class="btn-large">إعادة اللعبة - Reset</button>
    </div>

    <script src="fortress/fortress.js"></script>
</body>
</html>
