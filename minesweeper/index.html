<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper 💣</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/900.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --cs: 36px;
    --bg1:#0a0e17; --bg2:#0f172a; --bg3:#1e293b;
    --panel: rgba(15,23,42,.7);
    --panel-border: rgba(51,65,85,.8);
    --accent:#3b82f6; --danger:#ef4444; --ok:#4ade80;
  }
  html,body{ height:100%; }
  body{
    font-family:'Inter', 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(1200px 700px at 85% -10%, #2563eb33, transparent 60%),
                radial-gradient(900px 600px at 0% 110%, #0ea5e933, transparent 60%),
                linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
    min-height:100vh; color:#e2e8f0;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(14px, 4vw, 24px); overflow-x:hidden; position:relative;
  }
  /* Background blobs */
  .blob{ position:fixed; border-radius:50%; filter:blur(70px); opacity:.35; z-index:0; pointer-events:none; animation:floaty 12s ease-in-out infinite alternate; }
  .b1{ width:340px; height:340px; background:#3b82f6; top:-90px; left:-90px; }
  .b2{ width:280px; height:280px; background:#0ea5e9; bottom:-70px; right:-70px; animation-delay:-5s; }
  .b3{ width:200px; height:200px; background:#fbbf2433; top:40%; left:60%; animation-delay:-8s; }
  @keyframes floaty{ from{ transform:translateY(-15px) scale(1);} to{ transform:translateY(20px) scale(1.08);} }

  .wrap{ position:relative; z-index:1; width:100%; max-width:760px; display:flex; flex-direction:column; align-items:center; gap:clamp(10px, 3vw, 14px); }

  header{ text-align:center; animation:dropIn .6s ease both; }
  header h1{
    font-weight:900; font-size:clamp(1.6rem, 5vw, 2.4rem);
    background:linear-gradient(90deg,#3b82f6,#60a5fa,#93c5fd);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    letter-spacing:.5px;
  }
  header p{ color:#94a3b8; font-size:.9rem; margin-top:2px; }
  @keyframes dropIn{ from{ opacity:0; transform:translateY(-18px);} to{ opacity:1; transform:none;} }

  .difficulty{ display:flex; gap:8px; background:var(--panel); border:1px solid var(--panel-border); padding:6px; border-radius:14px; backdrop-filter:blur(8px); animation:dropIn .6s .1s ease both; }
  .difficulty button{
    font-family:inherit; font-weight:700; font-size:.9rem; color:#cbd5e1;
    background:transparent; border:none; padding:7px 18px; border-radius:10px; cursor:pointer;
    transition:all .25s;
  }
  .difficulty button:hover{ color:#fff; background:rgba(255,255,255,.08); }
  .difficulty button.active{
    background:linear-gradient(135deg,#2563eb,#3b82f6); color:#fff;
    box-shadow:0 4px 14px #2563eb66;
  }

  .hud{
    width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:18px; padding:10px 14px; backdrop-filter:blur(10px);
    animation:dropIn .6s .2s ease both;
  }
  .counter{
    display:flex; align-items:center; gap:8px; min-width:92px;
    background:#0b0e2166; border:1px solid var(--panel-border); border-radius:12px; padding:6px 12px;
  }
  .counter .ico{ font-size:1.2rem; }
  .counter .val{
    font-weight:900; font-size:1.25rem; font-variant-numeric:tabular-nums; min-width:44px; text-align:center;
    color:var(--accent); text-shadow:0 0 12px #3b82f655;
  }
  .counter.time .val{ color:#7dd3fc; text-shadow:0 0 12px #7dd3fc55; }

  .face{
    width:54px; height:54px; border-radius:50%; border:none; cursor:pointer; font-size:1.7rem;
    background:linear-gradient(145deg,#1e293b,#0f172a);
    border:1px solid var(--panel-border);
    box-shadow:0 5px 16px #00000066, inset 0 1px 0 #ffffff22;
    transition:transform .15s;
    display:grid; place-items:center;
  }
  .face:hover{ transform:scale(1.1) rotate(6deg); }
  .face:active{ transform:scale(.92); }

  .tools{ display:flex; gap:10px; animation:dropIn .6s .3s ease both; }
  .flagToggle{
    font-family:inherit; font-weight:700; font-size:.95rem; cursor:pointer;
    display:flex; align-items:center; gap:8px;
    color:#fca5a5; background:var(--panel); border:1px solid var(--panel-border);
    padding:8px 20px; border-radius:12px; transition:all .25s; backdrop-filter:blur(8px);
  }
  .flagToggle:hover{ background:rgba(255,255,255,.1); }
  .flagToggle.on{
    background:linear-gradient(135deg,#ef444488,#f9731655);
    border-color:#fca5a5; box-shadow:0 0 18px #ef444d44; color:#fff;
  }

  .boardBox{
    background:var(--panel); border:1px solid var(--panel-border);
    padding:12px; border-radius:20px; backdrop-filter:blur(10px);
    max-width:100%; overflow:auto; animation:dropIn .6s .35s ease both;
    box-shadow:0 20px 60px #00000055;
  }
  #board{ display:grid; gap:3px; direction:ltr; user-select:none; }
  #board.shake{ animation:shake .5s; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); } 15%{ transform:translate(-7px,3px);}
    30%{ transform:translate(6px,-4px);} 45%{ transform:translate(-5px,-3px);}
    60%{ transform:translate(5px,3px);} 75%{ transform:translate(-3px,1px);} 90%{ transform:translate(2px,-1px);}
  }

  .cell{
    width:var(--cs); height:var(--cs);
    display:grid; place-items:center;
    font-weight:900; font-size:calc(var(--cs) * .52);
    border-radius:7px; cursor:pointer;
    background:linear-gradient(145deg,#334155,#1e293b);
    border:1px solid #475569aa;
    box-shadow:inset 0 2px 0 #ffffff2e, inset 0 -3px 0 #00000045, 0 2px 4px #00000040;
    transition:background .15s, transform .1s, box-shadow .2s;
    touch-action:manipulation;
  }
  .cell:not(.revealed):hover{ filter:brightness(1.18); }
  .cell:not(.revealed):active{ transform:scale(.9); }
  .cell.revealed{
    background:#0f172a; border:1px solid #ffffff0d; box-shadow:inset 0 2px 8px #00000070;
    cursor:default; animation:pop .28s ease;
  }
  .cell.revealed.chordable{ cursor:pointer; }
  .cell.revealed.chordable:hover{ background:#1e293b; box-shadow:inset 0 0 0 2px #3b82f666, inset 0 2px 8px #00000070; }
  @keyframes pop{ 0%{ transform:scale(.4); opacity:0; } 70%{ transform:scale(1.12);} 100%{ transform:scale(1);} }
  .cell.flagged{ background:linear-gradient(145deg,#7a3b4a,#4d2540); border-color:#fca5a555; }
  .cell.wrongFlag{ background:#3a1020 !important; box-shadow:inset 0 0 0 2px #ef4444; }
  .cell.mine{
    background:radial-gradient(circle at 35% 30%, #7f1d1d, #1a0a0a) !important;
    animation:minePop .4s ease both;
  }
  .cell.boom{ background:radial-gradient(circle at 50% 50%, #ef4444, #7f1d1d) !important; box-shadow:0 0 22px #ef4444; }
  @keyframes minePop{ from{ transform:scale(0) rotate(-90deg);} to{ transform:scale(1) rotate(0);} }
  .n1{color:#60a5fa;} .n2{color:#4ade80;} .n3{color:#fbbf24;} .n4{color:#a78bfa;}
  .n5{color:#fbbf24;} .n6{color:#22d3ee;} .n7{color:#fb7185;} .n8{color:#e2e8f0;}

  .hint{ color:#94a3b8; font-size:.82rem; text-align:center; animation:dropIn .6s .45s ease both; }

  /* Result modal */
  .overlay{
    position:fixed; inset:0; background:#05051acc; backdrop-filter:blur(6px);
    display:grid; place-items:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .35s;
  }
  .overlay.show{ opacity:1; pointer-events:auto; }
  .modal{
    background:linear-gradient(160deg,#1e293b,#0f172a);
    border:1px solid #ffffff22; border-radius:24px; padding:34px 44px; text-align:center;
    box-shadow:0 30px 80px #000000aa; transform:scale(.7) translateY(30px); transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    max-width:90vw;
  }
  .overlay.show .modal{ transform:none; }
  .modal .big{ font-size:3.4rem; animation:bounce 1s infinite alternate ease-in-out; display:inline-block; }
  @keyframes bounce{ from{ transform:translateY(0);} to{ transform:translateY(-10px);} }
  .modal h2{ font-size:1.9rem; font-weight:900; margin:6px 0 4px; }
  .modal.win h2{ color:var(--ok); } .modal.lose h2{ color:var(--danger); }
  .modal p{ color:#cbd5e1; margin:4px 0; font-size:1rem; }
  .modal .best{ color:var(--accent); font-weight:700; }
  .modal button{
    margin-top:18px; font-family:inherit; font-weight:800; font-size:1.05rem; cursor:pointer;
    color:#0f172a; background:linear-gradient(135deg,#3b82f6,#60a5fa);
    border:none; padding:12px 38px; border-radius:14px;
    box-shadow:0 8px 22px #3b82f644; transition:transform .15s;
  }
  .modal button:hover{ transform:translateY(-2px) scale(1.04); }

  #confetti{ position:fixed; inset:0; pointer-events:none; z-index:60; }
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <h1>💣 Minesweeper</h1>
    <p>Reveal all cells and avoid the mines!</p>
  </header>

  <div class="difficulty" id="diffBar">
    <button data-d="easy" class="active">Easy</button>
    <button data-d="medium">Medium</button>
    <button data-d="hard">Hard</button>
  </div>

  <div class="hud">
    <div class="counter"><span class="ico">💣</span><span class="val" id="mineCount">010</span></div>
    <button class="face" id="faceBtn" title="New Game">🙂</button>
    <div class="counter time"><span class="ico">⏱️</span><span class="val" id="timer">000</span></div>
  </div>

  <div class="tools">
    <button class="flagToggle" id="flagBtn">🚩 Flag Mode: <span id="flagState">OFF</span></button>
  </div>

  <div class="boardBox"><div id="board"></div></div>

  <p class="hint">Click to reveal • Right-click or long-press to flag 🚩 • Click on revealed number to chord</p>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <span class="big" id="modalEmoji">🎉</span>
    <h2 id="modalTitle">You Win!</h2>
    <p id="modalMsg"></p>
    <button id="againBtn">🔄 Play Again</button>
  </div>
</div>

<script>
(function(){
  const DIFFS = {
    easy:   { rows:9,  cols:9,  mines:10 },
    medium: { rows:12, cols:12, mines:24 },
    hard:   { rows:16, cols:16, mines:48 }
  };
  let diffKey = 'easy';
  let rows, cols, minesTotal;
  let grid = [];           // {mine, num, revealed, flagged, el}
  let started = false, over = false;
  let flagsCount = 0, revealedCount = 0;
  let seconds = 0, timerInt = null;
  let flagMode = false;
  let longPressTimer = null, suppressClick = false;

  const boardEl = document.getElementById('board');
  const mineCountEl = document.getElementById('mineCount');
  const timerEl = document.getElementById('timer');
  const faceBtn = document.getElementById('faceBtn');
  const flagBtn = document.getElementById('flagBtn');
  const flagState = document.getElementById('flagState');
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal');

  function pad(n){ return String(Math.min(999, Math.max(-99, n))).padStart(3,'0'); }
  function updateMineCounter(){ mineCountEl.textContent = pad(minesTotal - flagsCount); }
  function updateTimer(){ timerEl.textContent = pad(seconds); }

  function startTimer(){
    if (timerInt) return;
    timerInt = setInterval(()=>{ seconds++; updateTimer(); }, 1000);
  }
  function stopTimer(){ clearInterval(timerInt); timerInt = null; }

  function computeCellSize(){
    const avail = Math.min(window.innerWidth - 60, 700);
    const s = Math.max(22, Math.min(40, Math.floor(avail / cols)));
    boardEl.style.setProperty('--cs', s + 'px');
  }

  function newGame(){
    const d = DIFFS[diffKey];
    rows = d.rows; cols = d.cols; minesTotal = d.mines;
    started = false; over = false; flagsCount = 0; revealedCount = 0;
    seconds = 0; stopTimer(); updateTimer(); updateMineCounter();
    faceBtn.textContent = '🙂';
    overlay.classList.remove('show');
    computeCellSize();
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cs))`;
    grid = [];
    for (let r = 0; r < rows; r++){
      grid[r] = [];
      for (let c = 0; c < cols; c++){
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.r = r; el.dataset.c = c;
        boardEl.appendChild(el);
        grid[r][c] = { mine:false, num:0, revealed:false, flagged:false, el };
      }
    }
  }

  function neighbors(r, c){
    const out = [];
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++){
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push([nr, nc]);
      }
    return out;
  }

  function placeMines(safeR, safeC){
    const banned = new Set([safeR + ',' + safeC]);
    neighbors(safeR, safeC).forEach(([r,c]) => banned.add(r + ',' + c));
    let placed = 0;
    while (placed < minesTotal){
      const r = Math.floor(Math.random() * rows);
      const c = Math.floor(Math.random() * cols);
      const key = r + ',' + c;
      if (banned.has(key) || grid[r][c].mine) continue;
      grid[r][c].mine = true; placed++;
    }
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        grid[r][c].num = neighbors(r,c).filter(([nr,nc]) => grid[nr][nc].mine).length;
  }

  function setCellText(cell){
    if (cell.flagged){ cell.el.textContent = '🚩'; return; }
    if (!cell.revealed){ cell.el.textContent = ''; return; }
    if (cell.mine){ cell.el.textContent = '💣'; return; }
    cell.el.textContent = cell.num ? cell.num : '';
  }

  function reveal(r, c){
    const cell = grid[r][c];
    if (cell.revealed || cell.flagged) return;
    if (!started){ started = true; startTimer(); placeMines(r, c); }
    if (cell.mine){ lose(r, c); return; }
    const stack = [[r, c]];
    while (stack.length){
      const [cr, cc] = stack.pop();
      const cur = grid[cr][cc];
      if (cur.revealed || cur.flagged || cur.mine) continue;
      cur.revealed = true; revealedCount++;
      cur.el.classList.add('revealed');
      if (cur.num > 0){ cur.el.classList.add('n' + cur.num, 'chordable'); }
      setCellText(cur);
      if (cur.num === 0) neighbors(cr, cc).forEach(p => stack.push(p));
    }
    checkWin();
  }

  function chord(r, c){
    const cell = grid[r][c];
    if (!cell.revealed || cell.num === 0) return;
    const nb = neighbors(r, c);
    const flagged = nb.filter(([nr,nc]) => grid[nr][nc].flagged).length;
    if (flagged !== cell.num) return;
    const targets = nb.filter(([nr,nc]) => !grid[nr][nc].revealed && !grid[nr][nc].flagged);
    for (const [nr, nc] of targets){
      if (over) break;
      reveal(nr, nc);
    }
  }

  function toggleFlag(r, c){
    const cell = grid[r][c];
    if (over || cell.revealed) return;
    if (!started){ started = true; startTimer(); }
    cell.flagged = !cell.flagged;
    flagsCount += cell.flagged ? 1 : -1;
    cell.el.classList.toggle('flagged', cell.flagged);
    setCellText(cell);
    updateMineCounter();
  }

  function lose(r, c){
    over = true; stopTimer();
    faceBtn.textContent = '😵';
    boardEl.classList.add('shake');
    setTimeout(()=> boardEl.classList.remove('shake'), 600);
    let delay = 0;
    for (let rr = 0; rr < rows; rr++)
      for (let cc = 0; cc < cols; cc++){
        const cell = grid[rr][cc];
        if (cell.mine && !cell.flagged){
          cell.revealed = true;
          cell.el.classList.add('mine');
          cell.el.style.animationDelay = (delay += 0.03) + 's';
          setCellText(cell);
        } else if (!cell.mine && cell.flagged){
          cell.el.classList.add('wrongFlag');
          cell.el.textContent = '❌';
        }
      }
    grid[r][c].el.classList.add('boom');
    grid[r][c].el.textContent = '💥';
    setTimeout(()=> showModal(false), 900);
  }

  function checkWin(){
    if (over) return;
    if (revealedCount === rows * cols - minesTotal){
      over = true; stopTimer();
      faceBtn.textContent = '😎';
      // Flag remaining mines
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++){
          const cell = grid[r][c];
          if (cell.mine && !cell.flagged){
            cell.flagged = true; flagsCount++;
            cell.el.classList.add('flagged');
            setCellText(cell);
          }
        }
      updateMineCounter();
      launchConfetti();
      setTimeout(()=> showModal(true), 600);
    }
  }

  function showModal(win){
    modal.className = 'modal ' + (win ? 'win' : 'lose');
    document.getElementById('modalEmoji').textContent = win ? '🎉' : '💥';
    document.getElementById('modalTitle').textContent = win ? 'Congratulations! You Won!' : 'Boom! Game Over';
    const key = 'ms_best_' + diffKey;
    let msg = '';
    if (win){
      const best = localStorage.getItem(key);
      if (!best || seconds < Number(best)){
        localStorage.setItem(key, seconds);
        msg = `Finished in <b>${seconds}</b> seconds — New Record! 🏆`;
      } else {
        msg = `Finished in <b>${seconds}</b> seconds • Best: <span class="best">${best}s</span>`;
      }
    } else {
      const best = localStorage.getItem(key);
      msg = best ? `Previous best: <span class="best">${best}s</span> — Try again!` : 'No worries, try again!';
    }
    document.getElementById('modalMsg').innerHTML = msg;
    overlay.classList.add('show');
  }

  /* ===== Events ===== */
  boardEl.addEventListener('click', e => {
    if (suppressClick){ suppressClick = false; return; }
    const t = e.target.closest('.cell');
    if (!t || over) return;
    const r = +t.dataset.r, c = +t.dataset.c;
    if (flagMode && !grid[r][c].revealed){ toggleFlag(r, c); return; }
    if (grid[r][c].revealed) chord(r, c); else reveal(r, c);
  });

  boardEl.addEventListener('contextmenu', e => {
    e.preventDefault();
    const t = e.target.closest('.cell');
    if (!t || over) return;
    toggleFlag(+t.dataset.r, +t.dataset.c);
  });

  // Long press for mobile
  boardEl.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'touch') return;
    const t = e.target.closest('.cell');
    if (!t || over) return;
    const r = +t.dataset.r, c = +t.dataset.c;
    longPressTimer = setTimeout(()=>{
      if (!grid[r][c].revealed){ toggleFlag(r, c); suppressClick = true; navigator.vibrate && navigator.vibrate(40); }
      longPressTimer = null;
    }, 420);
  });
  const cancelLP = () => { if (longPressTimer){ clearTimeout(longPressTimer); longPressTimer = null; } };
  boardEl.addEventListener('pointerup', cancelLP);
  boardEl.addEventListener('pointermove', cancelLP);
  boardEl.addEventListener('pointerleave', cancelLP);

  flagBtn.addEventListener('click', () => {
    flagMode = !flagMode;
    flagBtn.classList.toggle('on', flagMode);
    flagState.textContent = flagMode ? 'ON' : 'OFF';
  });

  faceBtn.addEventListener('click', newGame);
  document.getElementById('againBtn').addEventListener('click', newGame);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

  document.getElementById('diffBar').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    document.querySelectorAll('#diffBar button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    diffKey = b.dataset.d;
    newGame();
  });

  window.addEventListener('resize', computeCellSize);

  /* ===== Confetti ===== */
  const cvs = document.getElementById('confetti');
  const ctx = cvs.getContext('2d');
  let pieces = [], confettiAnim = null;
  function resizeCvs(){ cvs.width = innerWidth; cvs.height = innerHeight; }
  resizeCvs(); window.addEventListener('resize', resizeCvs);

  function launchConfetti(){
    pieces = [];
    const colors = ['#3b82f6','#60a5fa','#4ade80','#fbbf24','#fb7185','#a78bfa'];
    for (let i = 0; i < 180; i++){
      pieces.push({
        x: Math.random() * cvs.width,
        y: Math.random() * cvs.height - cvs.height,
        vx: Math.random() * 4 - 2,
        vy: Math.random() * 5 + 3,
        size: Math.random() * 8 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rot: Math.random() * 360,
        vr: Math.random() * 8 - 4
      });
    }
    if (confettiAnim) cancelAnimationFrame(confettiAnim);
    const tick = () => {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.y > cvs.height) p.y = -20;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      });
      confettiAnim = requestAnimationFrame(tick);
    };
    tick();
    setTimeout(()=>{ if (confettiAnim){ cancelAnimationFrame(confettiAnim); ctx.clearRect(0,0,cvs.width,cvs.height); } }, 4000);
  }

  newGame();
})();
</script>
</body>
</html>
