<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Card Game</title>
    <link rel="icon" href="image/logo-nobg.png"/>
    <link rel="stylesheet" href="memory/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3758016323496227"
    crossorigin="anonymous"></script>
    <!-- Google AdSense script -->
    <script data-ad-client="pub-3758016323496227" asyncsrc="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</head>
<body>
    <h1>Memory Card Game</h1>
    <p>Flip two cards at a time. Match pairs before your tries run out.</p>
    <label for="level-select">Select Level:</label>
    <select id="level-select">
        <option value="4">4x4</option>
        <option value="8">6x5</option>
    </select>
    <div id="game-board"></div>
    <div id="tries">Tries: 0</div>
    <button id="reset-button">Reset Game</button>
    <button id="hint-button">Get a Hint</button>

    <script src="memory/script.js"></script>
</body>
</html>
