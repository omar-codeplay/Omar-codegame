<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="image/logo-nobg.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3758016323496227"
        crossorigin="anonymous"></script>
    <title>Home - Games Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, #00b2ff 0%, #0011ff 100%);
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            backdrop-filter: blur(5px);
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #333;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .button {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: calc(50% - 20px);
            height: 180px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #005eff; /* fallback color */
        }

        /* Frosted glass overlay with blur */
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(3px);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .button:hover::before {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .button span {
            position: relative;
            z-index: 2;
            font-size: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        /* Background images for each game */
        .button.xo {
            background-image: url('image/X_O.png');
        }

        .button.chess {
            background-image: url('image/chess.png'); /* New chess thumbnail */
        }

        .button.connect4 {
            background-image: url('image/connect4.png');
        }

        .button.memory {
            background-image: url('image/cards.png');
        }

        .button.cubes {
            background-image: url('image/Rcube.png');
        }

        .button.crossroad {
            background-image: url('image/crossroad.png');
        }

        .button.coloriq {
            background-image: url('image/colors.png');
        }

        .button.bakasa {
            background-image: url('image/bakasa.png');
        }

        .button.fortress {
            background-image: url('image/fortress.png');
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: white;
            font-size: 1rem;
        }

        footer a {
            color: #ffd700;
            text-decoration: none;
            font-weight: bold;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .button {
                width: 100%;
                height: 120px;
                font-size: 1.5rem;
            }
        }

        @media (max-width: 400px) {
            .button {
                height: 100px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎮 اختر لعبتك المفضلة</h1>
        <div class="button-container">
            <a href="Tic Tac Toe.html" class="button xo"><span>X/O</span></a>
            <a href="Chess.html" class="button chess"><span>Chess</span></a>
            <a href="connect4.html" class="button connect4"><span>Connect 4</span></a>
            <a href="memory.html" class="button memory"><span>Memory</span></a>
            <a href="cube.html" class="button cubes"><span>Cubes</span></a>
            <a href="crossroad.html" class="button crossroad"><span>Crossroad</span></a>
            <a href="coloriq.html" class="button coloriq"><span>IQ Test</span></a>
            <a href="bakasa.html" class="button bakasa"><span>بكاسه</span></a>
            <a href="fortress.html" class="button fortress"><span>Fortress</span></a>
        </div>
    </div>
    <footer>
        <p>📌 موقعي الآخر: <a href="https://omar-codeplay.netlify.app/" target="_blank">omar-codeplay.netlify.app</a>
        </p>
        <p>&copy; 2026 Omar CodePlay</p>
    </footer>
</body>

</html>
