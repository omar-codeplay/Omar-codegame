    <style>
        * {

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
            color: #333;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .button {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: calc(50% - 20px);
            height: 180px;
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.8);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: #005eff; /* fallback color */
        }

        /* Frosted glass overlay with blur */
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(1.5px);
            -webkit-backdrop-filter: blur(3px);
            transition: all 0.3s ease;
            z-index: 1;
        }

        .button:hover::before {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .button span {
            position: relative;
            z-index: 2;
            font-size: inherit;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .button:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }
