<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamePlay Arena - العب مع أصدقائك | Omar GamePlay</title>
    <meta name="description" content="استمتع بألعاب ثنائية مع أصدقائك. اختر من بين الشطرنج، كونكت 4، لعبة الذاكرة، بكاسه، سودوكو، وفورتريس ديويل. العب مجاناً بدون تحميل.">
    <meta name="author" content="Omar CodePlay">
    <link rel="canonical" href="https://omar-gameplay.netlify.app/">
    <meta property="og:title" content="GamePlay Arena - ألعاب ثنائية مجانية">
    <meta property="og:description" content="10 ألعاب ممتعة: شطرنج، كونكت 4، بكاسه، سودوكو، فورتريس وأكثر. العب مجاناً.">
    <meta property="og:image" content="https://omar-gameplay.netlify.app/image/og-preview.jpg">
    <link rel="icon" href="image/logo-nobg.png" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3758016323496227" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #040303;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 10% 20%, rgba(129,182,76,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 60% 50% at 90% 80%, rgba(79,133,201,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(244,193,67,0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: rgba(129,182,76,0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }

        .particle:nth-child(1) { left: 10%; top: 20%; width: 4px; height: 4px; animation-duration: 12s; animation-delay: 0s; background: rgba(129,182,76,0.2); }
        .particle:nth-child(2) { left: 25%; top: 60%; width: 2px; height: 2px; animation-duration: 15s; animation-delay: 1s; background: rgba(79,133,201,0.2); }
        .particle:nth-child(3) { left: 40%; top: 30%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: 2s; background: rgba(244,193,67,0.2); }
        .particle:nth-child(4) { left: 55%; top: 70%; width: 2px; height: 2px; animation-duration: 18s; animation-delay: 0.5s; background: rgba(129,182,76,0.15); }
        .particle:nth-child(5) { left: 70%; top: 15%; width: 4px; height: 4px; animation-duration: 14s; animation-delay: 1.5s; background: rgba(79,133,201,0.2); }
        .particle:nth-child(6) { left: 85%; top: 50%; width: 2px; height: 2px; animation-duration: 11s; animation-delay: 3s; background: rgba(244,193,67,0.15); }
        .particle:nth-child(7) { left: 50%; top: 85%; width: 3px; height: 3px; animation-duration: 16s; animation-delay: 0.8s; background: rgba(129,182,76,0.2); }
        .particle:nth-child(8) { left: 15%; top: 45%; width: 2px; height: 2px; animation-duration: 13s; animation-delay: 2.2s; background: rgba(79,133,201,0.15); }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(30, 28, 25, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            max-width: 1100px;
            width: 100%;
            border: 1px solid rgba(58, 56, 53, 0.5);
            animation: containerIn 0.8s ease-out;
        }

        @keyframes containerIn {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .header-section {
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #81b64c, #4f85c9);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 8px 32px rgba(129,182,76,0.3);
            animation: pulseGlow 3s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 8px 32px rgba(129,182,76,0.3); }
            50% { box-shadow: 0 8px 48px rgba(129,182,76,0.5); }
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #81b64c, #f4c143, #4f85c9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #8a8278;
            font-size: 1.05rem;
            font-weight: 400;
        }

        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }

        .button {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            width: calc(33.333% - 16px);
            min-width: 200px;
            height: 200px;
            padding: 20px;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            background-size: cover;
            background-position: center;
            overflow: hidden;
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            border: 1px solid rgba(58,56,53,0.6);
            background-color: #2a2825;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: cardFadeIn 0.6s ease-out backwards;
        }

        .button:nth-child(1) { animation-delay: 0.05s; }
        .button:nth-child(2) { animation-delay: 0.1s; }
        .button:nth-child(3) { animation-delay: 0.15s; }
        .button:nth-child(4) { animation-delay: 0.2s; }
        .button:nth-child(5) { animation-delay: 0.25s; }
        .button:nth-child(6) { animation-delay: 0.3s; }
        .button:nth-child(7) { animation-delay: 0.35s; }
        .button:nth-child(8) { animation-delay: 0.4s; }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(40px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .button::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.1) 100%);
            z-index: 1;
            transition: all 0.4s ease;
        }

        .button::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, transparent 0%, transparent 40%, rgba(129,182,76,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .button:hover::after {
            opacity: 1;
        }

        .button:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-color: rgba(129,182,76,0.4);
        }

        .button:hover::before {
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, rgba(129,182,76,0.15) 50%, rgba(0,0,0,0.1) 100%);
        }

        .button span {
            position: relative;
            z-index: 2;
            font-size: inherit;
            letter-spacing: 1px;
        }

        .button .card-sub {
            position: relative;
            z-index: 2;
            font-size: 0.7rem;
            font-weight: 400;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            color: rgba(255,255,255,0.6);
            margin-top: 4px;
        }

        .button:hover .card-sub {
            opacity: 1;
            transform: translateY(0);
        }

        .button .card-glow {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .button:hover .card-glow {
            opacity: 1;
        }

        .button.xo .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(129,182,76,0.15), transparent 60%); }
        .button.chess .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(79,133,201,0.15), transparent 60%); }
        .button.connect4 .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(231,76,60,0.15), transparent 60%); }
        .button.memory .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(155,89,182,0.15), transparent 60%); }
        .button.crossroad .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(244,193,67,0.15), transparent 60%); }
        .button.coloriq .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(46,204,113,0.15), transparent 60%); }
        .button.bakasa .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(102,126,234,0.15), transparent 60%); }
        .button.fortress .card-glow { background: radial-gradient(600px circle at var(--mx, 50%) var(--my, 50%), rgba(231,76,60,0.15), transparent 60%); }

        .button.xo { background-image: url('image/X_O.png'); }
        .button.chess { background-image: url('image/chess.png'); }
        .button.connect4 { background-image: url('image/connect4.png'); }
        .button.memory { background-image: url('image/cards.png'); }
        .button.crossroad { background-image: url('image/crossroad.png'); }
        .button.coloriq { background-image: url('image/colors.png'); }
        .button.bakasa { background-image: url('image/bakasa.png'); }
        .button.fortress { background-image: url('image/fortress.png'); }

        footer {
            position: relative;
            z-index: 1;
            margin-top: 30px;
            text-align: center;
            color: #5a5550;
            font-size: 0.85rem;
            animation: containerIn 0.8s ease-out 0.5s backwards;
        }

        footer a {
            color: rgba(244,193,67,0.7);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #f4c143;
        }

        footer .divider {
            margin: 0 8px;
            color: #3a3835;
        }

        @media (max-width: 900px) {
            .button { width: calc(50% - 12px); min-width: 140px; height: 170px; font-size: 1.1rem; }
            h1 { font-size: 2.2rem; }
            .container { padding: 30px 20px; }
        }

        @media (max-width: 600px) {
            .button { width: 100%; height: 140px; font-size: 1.1rem; min-width: 0; }
            .button .card-sub { opacity: 1; transform: none; font-size: 0.65rem; }
            h1 { font-size: 1.6rem; }
            .container { padding: 20px 14px; border-radius: 20px; }
            .logo-icon { width: 50px; height: 50px; font-size: 24px; }
            .header-section { margin-bottom: 24px; }
            .button-container { gap: 12px; }
        }

        @media (max-width: 400px) {
            .button { height: 120px; padding: 14px; }
            h1 { font-size: 1.4rem; }
            .container { padding: 16px 10px; border-radius: 16px; }
            .logo-icon { width: 42px; height: 42px; font-size: 20px; margin-bottom: 12px; }
            .button .card-sub { font-size: 0.6rem; }
            footer { font-size: 0.75rem; }
        }
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <div class="container">
        <div class="header-section">
            <div class="logo-icon">G</div>
            <h1>GamePlay Arena</h1>
            <p class="subtitle">اختر لعبتك واستمتع مع الأصدقاء</p>
        </div>
        <div class="button-container">
            <a href="Chess.html" class="button chess" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>Chess</span>
                <span class="card-sub">شطرنج احترافي</span>
                <span class="card-glow"></span>
            </a>
            <a href="connect4.html" class="button connect4" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>Connect 4</span>
                <span class="card-sub">أربعة في صف</span>
                <span class="card-glow"></span>
            </a>
            <a href="memory.html" class="button memory" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>Memory</span>
                <span class="card-sub">لعبة الذاكرة</span>
                <span class="card-glow"></span>
            </a>
            <a href="crossroad.html" class="button crossroad" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>Crossroad</span>
                <span class="card-sub">عبور الطريق</span>
                <span class="card-glow"></span>
            </a>
            <a href="coloriq.html" class="button coloriq" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>IQ Test</span>
                <span class="card-sub">اختبار الذكاء</span>
                <span class="card-glow"></span>
            </a>
            <a href="bakasa.html" class="button bakasa" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>بكاسه</span>
                <span class="card-sub">لعبة الجاسوس</span>
                <span class="card-glow"></span>
            </a>
            <a href="fortress.html" class="button fortress" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')">
                <span>Fortress</span>
                <span class="card-sub">قمة القلعة</span>
                <span class="card-glow"></span>
            </a>
            <a href="sudoku.html" class="button sudoku" onmousemove="this.style.setProperty('--mx', (event.offsetX / this.offsetWidth * 100) + '%'); this.style.setProperty('--my', (event.offsetY / this.offsetHeight * 100) + '%')" style="background-image:url('image/IQ.png')">
                <span>Sudoku</span>
                <span class="card-sub">سودوكو</span>
                <span class="card-glow"></span>
            </a>
        </div>
    </div>
    <footer>
        <a href="https://omar-codeplay.netlify.app/" target="_blank">omar-codeplay.netlify.app</a>
        <span class="divider">|</span>
        <span>&copy; 2026 Omar CodePlay</span>
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }

        document.querySelectorAll('.button').forEach(btn => {
            btn.addEventListener('mousemove', e => {
                const rect = btn.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                btn.style.setProperty('--mx', x + '%');
                btn.style.setProperty('--my', y + '%');
            });
        });
    </script>
</body>
</html>
