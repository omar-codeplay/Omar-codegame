<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="image/logo-nobg.png"/>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3758016323496227"
     crossorigin="anonymous"></script>
    <title>Home</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding-top: 1rem;
            background: linear-gradient(135deg, #dbdcdd, #b7c4d8);
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            color: #333;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .button {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 15px;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
            background-size: cover;
            background-position: center;
            width: calc(50% - 30px); /* Adjusted to fit two buttons per line */
            height: 100px; /* Ensure the buttons have a fixed height */
            overflow: hidden;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); /* Add text shadow for better readability */
        }
        .button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-size: cover;
            background-position: center;
            filter: blur(2px);
            z-index: 0;
        }
        .button span {
            position: relative;
            z-index: 1;
            font-size: 24px; /* Increase font size */
            text-transform: uppercase; /* Make text uppercase */
            letter-spacing: 1px; /* Add letter spacing */
        }
        .button:hover::before {
            background-color: rgba(0, 0, 0, 0.5);
        }
        .button.xo::before {
            background-image: url('image/X_O.png');
        }
        .button.chess::before {
            background-image: url('image/Chess.png');
        }
        .button.connect4::before {
            background-image: url('image/connect.png');
        }
        .button.memory::before {
            background-image: url('image/memory.png');
        }
        .button.cubes::before {
            background-image: url('image/Rcube.png');
        }
        .button.crossroad::before {
            background-image: url('image/crossroad.png');
        }
        .button.coloriq::before {
            background-image: url('image/IQ.png');
        }
        footer {
            margin-top: 20px;
            text-align: center;
            color: #666;
        }
        footer a {
            color: #007BFF;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            .button {
                width: 100%; /* Full width for smaller screens */
                margin: 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Select a Game</h1>
        <div class="button-container">
            <a href="Tic Tac Toe.html" class="button xo"><span>X/O</span></a>
            <a href="Chess.html" class="button chess"><span>Chess</span></a>
            <a href="connect4.html" class="button connect4"><span>Connect 4</span></a>
            <a href="memory.html" class="button memory"><span>Memory</span></a>
            <a href="cube.html" class="button cubes"><span>Cubes</span></a>
            <a href="crossroad.html" class="button crossroad"><span>Crossroad</span></a>
            <a href="coloriq.html" class="button coloriq"><span>IQ Test</span></a>
        </div>
    </div>
    <footer>
        <p>Check out my other website: <a href="https://omar-codeplay.netlify.app/" target="_blank">omar-codeplay.netlify.app</a></p>
        <p>&copy; 2025 Omar CodePlay</p>
    </footer>
</body>
</html>
